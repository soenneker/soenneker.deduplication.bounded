name: codeql

on:
  schedule:
    - cron: '57 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

jobs:
  analyze:
    runs-on: ubuntu-latest
    name: CodeQL Analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore src
        run: dotnet restore ./src/Soenneker.Deduplication.Bounded/Soenneker.Deduplication.Bounded.csproj --verbosity minimal

      - name: Build src
        run: dotnet build ./src/Soenneker.Deduplication.Bounded/Soenneker.Deduplication.Bounded.csproj --configuration Release --no-restore --verbosity minimal

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
